<template>
    <div class="pipeline-container">
        <!-- Pipeline Header -->
        <div class="pipeline-header">
            <div class="pipeline-title-row">
                <div class="pipeline-title">
                    <div class="pipeline-icon">📊</div>
                    <span>Deployment Pipeline</span>
                </div>
                <button class="refresh-btn" onclick={handleRefresh} disabled={isLoading}>
                    <span>🔄</span>
                    <span>Refresh</span>
                </button>
            </div>

            <!-- Pipeline Stats -->
            <template if:false={isLoading}>
                <div class="pipeline-stats">
                    <template for:each={stageStats} for:item="stat">
                        <div key={stat.stage} class="stat-box">
                            <div class="stat-stage-name">{stat.stage}</div>
                            <div class="stat-count">{stat.count}</div>
                            <div class="stat-label">artifacts</div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="loading-overlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading Pipeline...</div>
            </div>
        </template>

        <!-- Kanban Board -->
        <template if:false={isLoading}>
            <div class="kanban-board">
                <template for:each={stageData} for:item="stageInfo">
                    <div key={stageInfo.name} class={stageInfo.columnClass}>
                        <!-- Column Header -->
                        <div class={stageInfo.headerClass}>
                            <div class="column-title-row">
                                <h3 class="column-title">{stageInfo.name}</h3>
                                <span class="column-count">{stageInfo.count}</span>
                            </div>
                        </div>

                        <!-- Column Body -->
                        <div class="column-body">
                            <template if:true={stageInfo.count}>
                                <template for:each={stageInfo.artifacts} for:item="artifact">
                                    <div key={artifact.Id} class="artifact-card">
                                        <!-- Artifact Header -->
                                        <div class="artifact-header">
                                            <div class="artifact-name">{artifact.Name}</div>
                                            <div class={artifact.statusBadgeClass}>
                                                {artifact.Status__c}
                                            </div>
                                        </div>

                                        <!-- Artifact Details -->
                                        <div class="artifact-details">
                                            <div class="artifact-detail-row">
                                                <span class="detail-label">Components</span>
                                                <span class="detail-value">{artifact.componentCount}</span>
                                            </div>
                                            <div class="artifact-detail-row">
                                                <span class="detail-label">Created</span>
                                                <span class="detail-value">{artifact.formattedCreatedDate}</span>
                                            </div>
                                        </div>

                                        <!-- Actions -->
                                        <div class="artifact-actions">
                                            <template if:true={artifact.canPromote}>
                                                <button
                                                    class="artifact-btn artifact-btn-promote"
                                                    onclick={handlePromote}
                                                    data-artifact-id={artifact.Id}
                                                    data-stage={stageInfo.name}
                                                >
                                                    ⬆️ Promote
                                                </button>
                                            </template>
                                            <button
                                                class="artifact-btn artifact-btn-view"
                                                onclick={handleViewArtifact}
                                                data-artifact-id={artifact.Id}
                                            >
                                                👁️ View
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <!-- Empty State -->
                            <template if:false={stageInfo.count}>
                                <div class="empty-column">
                                    <div class="empty-icon">📦</div>
                                    <p class="empty-text">No artifacts in {stageInfo.name}</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Error State -->
            <template if:true={errorMessage}>
                <div class="error-container">
                    <div class="error-icon">⚠️</div>
                    <div class="error-content">
                        <h2 class="error-title">Error</h2>
                        <p class="error-message">{errorMessage}</p>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
