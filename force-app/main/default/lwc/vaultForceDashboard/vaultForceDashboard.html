<template>
    <div class="dashboard-container">
        <!-- Dashboard Header -->
        <div class="dashboard-header">
            <h1 class="dashboard-title">🚀 VaultForce Dashboard</h1>
            <p class="dashboard-subtitle">Manage your Salesforce deployments with ease</p>
        </div>

        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="loading-container">
                <div class="spinner"></div>
                <p class="loading-text">Loading Dashboard...</p>
            </div>
        </template>

        <!-- Dashboard Content -->
        <template if:false={isLoading}>
            <!-- Statistics Grid -->
            <div class="stats-grid">
                <!-- Total Orgs Stat -->
                <div class="stat-card primary">
                    <div class="stat-icon primary">🌐</div>
                    <div class="stat-value">{stats.totalOrgs}</div>
                    <div class="stat-label">Connected Orgs</div>
                    <div class="stat-change positive">↑ All Time</div>
                </div>

                <!-- Active Orgs Stat -->
                <div class="stat-card success">
                    <div class="stat-icon success">✓</div>
                    <div class="stat-value">{stats.activeOrgs}</div>
                    <div class="stat-label">Active Orgs</div>
                    <div class="stat-change positive">↑ Currently Active</div>
                </div>

                <!-- Total Deployments Stat -->
                <div class="stat-card warning">
                    <div class="stat-icon warning">📦</div>
                    <div class="stat-value">{stats.totalDeployments}</div>
                    <div class="stat-label">Total Deployments</div>
                    <div class="stat-change positive">↑ All Time</div>
                </div>

                <!-- Success Rate Stat -->
                <div class="stat-card info">
                    <div class="stat-icon info">📊</div>
                    <div class="stat-value">{successRate}</div>
                    <div class="stat-label">Success Rate</div>
                    <div class="stat-change positive">↑ Last 30 Days</div>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="content-grid">
                <!-- Recent Deployments -->
                <div class="modern-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <span>🚢</span>
                            Recent Deployments
                        </h2>
                    </div>
                    <div class="card-body">
                        <template if:true={recentDeployments.length}>
                            <template for:each={recentDeployments} for:item="deployment">
                                <div key={deployment.Id} class={deployment.deploymentItemClass}>
                                    <div class="deployment-header">
                                        <div class="deployment-name">{deployment.Name}</div>
                                        <div class={deployment.statusBadgeClass}>
                                            {deployment.Status__c}
                                        </div>
                                    </div>
                                    <div class="deployment-meta">
                                        <div class="meta-item">
                                            <span class="meta-label">Org</span>
                                            <span class="meta-value">{deployment.targetOrgName}</span>
                                        </div>
                                        <div class="meta-item">
                                            <span class="meta-label">Type</span>
                                            <span class="meta-value">{deployment.Deployment_Type__c}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={recentDeployments.length}>
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <p class="empty-state-text">No recent deployments</p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="modern-card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <span>📋</span>
                            Recent Activity
                        </h2>
                    </div>
                    <div class="card-body">
                        <template if:true={recentAuditLogs.length}>
                            <template for:each={recentAuditLogs} for:item="log">
                                <div key={log.Id} class="activity-item">
                                    <div class="activity-header">{log.Action__c}</div>
                                    <div class="activity-details">
                                        <div class="activity-detail">
                                            <strong>User:</strong> {log.Username__c}
                                        </div>
                                        <div class="activity-detail">
                                            <strong>Type:</strong> {log.Object_Type__c}
                                        </div>
                                        <div class="activity-detail">
                                            <strong>Time:</strong>
                                            <lightning-formatted-date-time value={log.Timestamp__c}></lightning-formatted-date-time>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template if:false={recentAuditLogs.length}>
                            <div class="empty-state">
                                <div class="empty-state-icon">📝</div>
                                <p class="empty-state-text">No recent activity</p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
