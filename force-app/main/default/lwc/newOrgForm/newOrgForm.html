<template>
    <div class="org-form-container">
        <div class="form-card">
            <!-- Form Header -->
            <div class="form-header">
                <div class="form-icon">🔐</div>
                <h1 class="form-title">Connect Salesforce Org</h1>
                <p class="form-subtitle">Securely connect your Salesforce organization</p>
            </div>

            <!-- Form Body -->
            <div class="form-body">
                <template if:false={isLoading}>
                    <template if:false={showOAuthFlow}>
                        <!-- Org Name -->
                        <div class="input-group">
                            <label class="input-label">
                                <span class="required-mark">*</span>
                                Org Name
                            </label>
                            <div class="input-wrapper">
                                <span class="input-icon">🏢</span>
                                <input
                                    class="modern-input"
                                    type="text"
                                    id="orgName"
                                    placeholder="e.g., Production Org"
                                    value={orgName}
                                    onchange={handleOrgNameChange}
                                />
                            </div>
                            <p class="input-hint">💡 Choose a descriptive name for easy identification</p>
                        </div>

                        <!-- Org Type -->
                        <div class="input-group">
                            <label class="input-label">
                                <span class="required-mark">*</span>
                                Org Type
                            </label>
                            <div class="input-wrapper">
                                <span class="input-icon">🏷️</span>
                                <select
                                    class="modern-select"
                                    id="orgType"
                                    value={orgType}
                                    onchange={handleOrgTypeChange}
                                >
                                    <option value="">-- Select Org Type --</option>
                                    <option value="Production">Production</option>
                                    <option value="Sandbox">Sandbox</option>
                                    <option value="Developer">Developer</option>
                                    <option value="Scratch">Scratch</option>
                                </select>
                            </div>
                        </div>

                        <!-- Instance URL -->
                        <div class="input-group">
                            <label class="input-label">
                                <span class="required-mark">*</span>
                                Instance URL
                            </label>
                            <div class="input-wrapper">
                                <span class="input-icon">🌐</span>
                                <input
                                    class="modern-input"
                                    type="url"
                                    id="instanceUrl"
                                    placeholder="e.g., https://login.salesforce.com"
                                    value={instanceUrl}
                                    onchange={handleInstanceUrlChange}
                                />
                            </div>
                            <p class="input-hint">💡 Use login.salesforce.com for production or test.salesforce.com for sandbox</p>
                        </div>

                        <!-- Info Box -->
                        <div class="info-box">
                            <div class="info-icon">ℹ️</div>
                            <div class="info-text">
                                You will be redirected to Salesforce to securely authorize VaultForce to access your org using OAuth 2.0.
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <button class="form-btn form-btn-cancel" onclick={handleCancel}>
                                ✕ Cancel
                            </button>
                            <button
                                class="form-btn form-btn-primary"
                                onclick={handleOAuthClick}
                                disabled={isButtonDisabled}
                            >
                                🔐 Authorize with OAuth
                            </button>
                        </div>

                        <!-- Error Message -->
                        <template if:true={errorMessage}>
                            <div class="error-alert">
                                <div class="error-alert-icon">⚠️</div>
                                <div class="error-alert-text">{errorMessage}</div>
                            </div>
                        </template>
                    </template>

                    <!-- OAuth Flow in Progress -->
                    <template if:true={showOAuthFlow}>
                        <div class="oauth-flow-container">
                            <div class="oauth-spinner-wrapper">
                                <div class="oauth-icon">🔄</div>
                                <div class="oauth-spinner"></div>
                                <p class="oauth-text">Redirecting to Salesforce...</p>
                                <p class="oauth-subtext">You will be redirected to authorize VaultForce</p>
                            </div>
                        </div>
                    </template>
                </template>

                <!-- Loading State -->
                <template if:true={isLoading}>
                    <div class="oauth-flow-container">
                        <div class="oauth-spinner-wrapper">
                            <div class="oauth-spinner"></div>
                            <p class="oauth-text">Processing...</p>
                            <p class="oauth-subtext">Please wait while we connect your org</p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
