<template>
    <div class="deployment-manager-container">
        <!-- Header -->
        <div class="manager-header">
            <div class="manager-title">
                <div class="title-icon">🚀</div>
                <span>Deployment Manager</span>
            </div>
            <div class="header-actions">
                <button class="action-btn action-btn-secondary" onclick={handleRefresh} disabled={isLoading}>
                    <span>🔄</span>
                    <span>Refresh</span>
                </button>
                <button class="action-btn action-btn-primary" onclick={handleNewDeployment}>
                    <span>➕</span>
                    <span>New Deployment</span>
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <template if:true={isLoading}>
            <div class="loading-overlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading Deployments...</div>
            </div>
        </template>

        <!-- Table -->
        <template if:false={isLoading}>
            <div class="table-container">
                <div class="table-wrapper">
                    <lightning-datatable
                        key-field="Id"
                        data={deployments}
                        columns={columns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column
                    ></lightning-datatable>
                </div>
            </div>
        </template>
    </div>

    <!-- Deployment Composer Modal -->
    <template if:true={showNewDeploymentModal}>
        <div class="modal-overlay">
            <div class="modal-container">
                <div class="modal-header">
                    <h2 class="modal-title">
                        <span>🚀</span>
                        <span>Deploy Metadata</span>
                    </h2>
                    <button class="close-btn" onclick={handleCloseModal} aria-label="Close">
                        ✕
                    </button>
                </div>

                <div class="modal-body">
                    <template if:true={deploymentComposerData}>
                        <!-- Target Org Selection -->
                        <div class="form-group">
                            <label class="form-label">
                                <span class="required">*</span> Target Org
                            </label>
                            <lightning-combobox
                                name="targetOrg"
                                value={deploymentComposerData.targetOrgId}
                                options={orgOptions}
                                onchange={handleDeployTargetOrgChange}
                                class="form-input"
                            ></lightning-combobox>
                        </div>

                        <!-- Test Level Selection -->
                        <div class="form-group">
                            <label class="form-label">
                                <span class="required">*</span> Test Level
                            </label>
                            <lightning-combobox
                                name="testLevel"
                                value={deploymentComposerData.testLevel}
                                options={testLevelOptions}
                                onchange={handleTestLevelChange}
                                class="form-input"
                            ></lightning-combobox>
                            <p class="form-hint">
                                ℹ️ {testLevelDescription}
                            </p>
                        </div>

                        <!-- Validation Only Toggle -->
                        <div class="form-group">
                            <div class="form-toggle">
                                <lightning-input
                                    type="toggle"
                                    label="Validation Only (Check Deploy)"
                                    checked={deploymentComposerData.validationOnly}
                                    onchange={handleValidationOnlyChange}
                                ></lightning-input>
                            </div>
                            <p class="form-hint">
                                ℹ️ Validates the deployment without actually deploying to the org
                            </p>
                        </div>

                        <!-- Deployment Summary -->
                        <template if:true={deploymentComposerData.items}>
                            <div class="summary-box">
                                <h3 class="summary-title">📊 Deployment Summary</h3>
                                <div class="summary-stats">
                                    <div class="summary-stat">
                                        <span class="summary-stat-label">Total Components</span>
                                        <span class="summary-stat-value">{deploymentComposerData.items.length}</span>
                                    </div>
                                    <template for:each={componentTypeGroups} for:item="group">
                                        <div key={group.type} class="summary-stat">
                                            <span class="summary-stat-label">{group.type}</span>
                                            <span class="summary-stat-value">{group.count}</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Error messages -->
                        <template if:true={deploymentError}>
                            <div class="error-box">
                                <div class="error-icon">⚠️</div>
                                <div class="error-content">
                                    <div class="error-title">Error</div>
                                    <p class="error-message">{deploymentError}</p>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:false={deploymentComposerData}>
                        <div class="error-box">
                            <div class="error-icon">ℹ️</div>
                            <div class="error-content">
                                <div class="error-title">No Deployment Data</div>
                                <p class="error-message">
                                    No deployment data available. Please select items from the comparison panel.
                                </p>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="modal-footer">
                    <button class="footer-btn footer-btn-cancel" onclick={handleCloseModal}>
                        Cancel
                    </button>
                    <button class="footer-btn footer-btn-primary" onclick={handleValidateDeployment} disabled={isDeploying}>
                        🔍 Validate
                    </button>
                    <button class="footer-btn footer-btn-primary" onclick={handleDeploy} disabled={isDeployButtonDisabled}>
                        🚀 Deploy
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
